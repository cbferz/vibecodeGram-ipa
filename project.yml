name: vibecodeGram
options:
  bundleIdPrefix: com.vibecodegram
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_API_BASE_URL: "https://api.vibecodegram.tendercheck.pro"
    INFOPLIST_KEY_CFBundleDisplayName: "vibecodeGram"
    ENABLE_PREVIEWS: YES
targets:
  vibecodeGram:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Features
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibecodegram.ios
        PRODUCT_NAME: vibecodeGram
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
    scheme:
      testTargets:
        - vibecodeGramTests
        - vibecodeGramUITests
  vibecodeGramTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: vibecodeGram
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibecodegram.ios.tests

  vibecodeGramUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: vibecodeGram
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibecodegram.ios.uitests
